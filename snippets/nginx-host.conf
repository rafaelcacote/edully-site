# Nginx do host → containers Edully
#
# Homolog: 127.0.0.1:8081  (develop)  → http://homolog.agendaedully.com.br/
# Prod:    127.0.0.1:8082  (master)   → http://app.agendaedully.com.br/   (aplicação)
#                                     → http://agendaedully.com.br/       (site de vendas)
#
# O mesmo container atende os dois domínios: o Laravel decide o que servir a
# partir de EDULLY_SITE_DOMAIN e EDULLY_APP_DOMAIN (ver config/edully.php).
# Como EDULLY_SITE_DOMAIN é o domínio sem "www", o acesso via www precisa do
# redirect abaixo — sem ele o Laravel não encontraria rota e devolveria 404.
#
# Instalar:
#   sudo cp deploy/proxy/nginx-host.conf /etc/nginx/sites-available/edully
#   sudo ln -sf /etc/nginx/sites-available/edully /etc/nginx/sites-enabled/edully
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (opcional):
#   sudo certbot --nginx -d homolog.agendaedully.com.br -d app.agendaedully.com.br \
#       -d agendaedully.com.br -d www.agendaedully.com.br

# --- Homologação (branch develop) ---
server {
    listen 80;
    listen [::]:80;
    server_name homolog.agendaedully.com.br;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# --- www → domínio sem www (evita conteúdo duplicado no Google) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.agendaedully.com.br;

    return 301 $scheme://agendaedully.com.br$request_uri;
}

# --- Produção (branch master): aplicação e site de vendas no mesmo container ---
server {
    listen 80;
    listen [::]:80;
    server_name app.agendaedully.com.br agendaedully.com.br;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
