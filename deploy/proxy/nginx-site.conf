# Adicionar ao /etc/nginx/sites-enabled/edully.conf (ou sites-available)
# Depois: nginx -t && systemctl reload nginx
# SSL: certbot --nginx -d agendaedully.com.br -d www.agendaedully.com.br

# --- Site de vendas (landing) ---
server {
    listen 80;
    listen [::]:80;
    server_name agendaedully.com.br www.agendaedully.com.br;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
