name: edully-site

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: edully-site:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"
    ports:
      # Host Nginx (CloudPanel) → este container
      - "127.0.0.1:8085:80"
    volumes:
      - site_storage:/var/www/html/storage/app
      - site_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edully_site

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-edully_site}
      POSTGRES_USER: ${DB_USERNAME:-edully}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - site_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-edully} -d ${DB_DATABASE:-edully_site}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edully_site

volumes:
  site_pgdata:
  site_storage:
  site_logs:

networks:
  edully_site:
    name: edully_site
